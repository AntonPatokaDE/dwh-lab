services:
  spark:
    image: dwh-spark-jobs:1.0

    build:
      context: ./spark
      
    env_file:
      - .env

    volumes:
      - ./jobs:/opt/spark/work-dir/jobs
      - ./jars:/opt/spark/work-dir/jars:ro

    working_dir: /opt/spark/work-dir

    networks:
      - dwh-net

    ports:
      - "4040:4040"

    

  dbt:
    image: dwh-dbt:1.0

    env_file:
      - .env

    build:
      context: ./dbt

    volumes:
      - ./dbt:/usr/app/dbt

    working_dir: /usr/app/dbt

    networks:
      - dwh-net


networks:
  dwh-net:
    external: true
    name: ${DWH_NETWORK_NAME:-dwh-net}
